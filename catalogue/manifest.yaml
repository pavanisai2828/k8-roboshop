apiVersion: apps/v1
kind: Deployement
metadata:
  name: catalogue
  namespace: roboshop
  lables:
    project: roboshop
    tier: db
    component: catalogue
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      tier: db
      component: catalogue
  template:
    metadata:
      labels: 
        project: roboshop
        tier: db
        component: catalogue
    spec:
      containers:
      - name: catalogue
        image: joindevops/catalogue:4.0.0
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: catalogue
spec:
  selector:
    project: roboshop
    tier: catalogue
    component: catalogue
  ports:
  - protcol: TCP
    port: 8080
    targetPort: 8080

  
